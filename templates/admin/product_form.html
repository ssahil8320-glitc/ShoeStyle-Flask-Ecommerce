{% extends "base.html" %}{% block title %}{{ 'Edit' if product else 'Add' }} Product | ShoeStyle{% endblock %}{% block content %}<section class="page-banner compact-banner"><span class="eyebrow">STORE MANAGEMENT</span><h1>{{ 'Edit' if product else 'Add a new' }} <em>product.</em></h1></section><section class="section narrow-section"><form class="form-card" method="post" enctype="multipart/form-data"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Category<select name="category" required>{% for cat in categories %}<option {% if product and product.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label><div class="two-fields"><label>Price (₹)<input type="number" name="price" min="0" required value="{{ product.price if product else '' }}"></label><label>Original price (₹)<input type="number" name="old_price" min="0" value="{{ product.old_price if product and product.old_price else '' }}"></label></div><div class="two-fields"><label>Stock quantity<input type="number" name="stock" min="0" required value="{{ product.stock if product else 10 }}"></label><label>Sizes (comma-separated)<input name="sizes" value="{{ product.sizes if product else '6,7,8,9,10' }}"></label></div><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><label>Product image upload<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label><label>Or image URL<input type="url" name="image_url" value="{{ product.image_url if product else '' }}" placeholder="https://..."></label><label class="checkbox-label"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Feature on homepage</label><button class="btn btn-dark btn-wide">Save product</button></form></section>{% endblock %}
